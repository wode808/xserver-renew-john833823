name: XServer-VPS
on:
  workflow_dispatch:

jobs:
  run_xserver_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/XServer-VPS-Renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/renew.py renew.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛡️ 启动 GOST 代理转发
        id: gost
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          XSERVER_ACCOUNT: ${{ secrets.XSERVER_ACCOUNT }}
        run: |
          if [ -z "$GOST_PROXY" ]; then
            echo "⚠️ GOST_PROXY 未配置"
            exit 1
          fi
      
          set -e
      
          VERSION=$(curl -fsSL https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
      
          echo "📦 GOST 版本: $VERSION"
      
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
      
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
      
          echo "✅ GOST 已启动，测试连通性..."

          if IP=$(curl -fsS \
              --max-time 15 \
              -x http://127.0.0.1:8080 \
              https://api.ipify.org)
          then
              echo "$IP" | sed -E 's/([0-9]+\.[0-9]+\.)[0-9]+\.[0-9]+/\1**.**/g'
              echo
              echo "✅ GOST 连通性测试成功"
          else
              echo
              echo "❌ GOST 连通性测试失败"
          
              pkill -f "gost -L" || true
          
              if [ -n "$TG_BOT" ] && [[ "$TG_BOT" == *,* ]]; then
                  CHAT_ID="${TG_BOT%%,*}"
                  BOT_TOKEN="${TG_BOT#*,}"
          
                  RUN_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')

                  MASKED_EMAIL="未知"
                  
                  if [ -n "$XSERVER_ACCOUNT" ]; then
                      ACCOUNT="${XSERVER_ACCOUNT%%,*}"
                  
                      if [[ "$ACCOUNT" == *"@"* ]]; then
                          NAME="${ACCOUNT%@*}"
                          DOMAIN="${ACCOUNT#*@}"
                  
                          if [ ${#NAME} -le 3 ]; then
                              MASKED_EMAIL="${NAME}********@${DOMAIN}"
                          else
                              MASKED_EMAIL="${NAME:0:3}********@${DOMAIN}"
                          fi
                      fi
                  fi
                  
                  
                  MSG="🔴 XServer VPS 续期通知
                  🕐 运行时间: ${RUN_TIME}
                  🖥 服务器: 🇯🇵 Xserver VPS
                  🧑🏻‍🏫 用户名: ${MASKED_EMAIL}
                  📊 续期结果: ⚠️ GOST 启动失败"
                  
                  curl -s \
                    -X POST \
                    "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${CHAT_ID}" \
                    --data-urlencode "text=${MSG}"
              fi
          
              exit 1
          fi
        
      - name: 🔄 GOST 成功后重置重试次数
        env:
          CRON_JOB: ${{ secrets.CRON_JOB }}
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import urllib.request

          cron = os.environ.get("CRON_JOB", "")
          if not cron or "," not in cron:
              exit(0)

          api_key, job_id = [x.strip() for x in cron.split(",",1)]

          req = urllib.request.Request(
              f"https://api.cron-job.org/jobs/{job_id}",
              headers={"Authorization":f"Bearer {api_key}"}
          )

          resp = json.load(
              urllib.request.urlopen(req, timeout=15)
          )
          
          print("Cron API 返回：")
          print(json.dumps(resp, ensure_ascii=False, indent=2))
          
          job = resp.get("job") or resp.get("jobDetails")
          
          if job is None:
              raise RuntimeError(
                  f"Cron API 返回异常：{json.dumps(resp, ensure_ascii=False)}"
              )

          if job.get("comment") != "retry=0":
              job["comment"] = "retry=0"

              req = urllib.request.Request(
                  f"https://api.cron-job.org/jobs/{job_id}",
                  data=json.dumps({"job":job}).encode(),
                  headers={
                      "Authorization":f"Bearer {api_key}",
                      "Content-Type":"application/json"
                  },
                  method="PATCH"
              )

              try:
                  urllib.request.urlopen(req, timeout=15)
                  print("retry 已清零")
              except Exception as e:
                  print(f"重置 retry 失败：{e}")
                  raise
          PYTHON

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool \
            scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          XSERVER_ACCOUNT: ${{ secrets.XSERVER_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          CRON_JOB: ${{ secrets.CRON_JOB }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"

      - name: 🧽 清理临时文件
        if: always()
        run: |
          pkill -f "gost -L" || true
          rm -f gost gost_*.tar.gz gost.log renew.py || true
